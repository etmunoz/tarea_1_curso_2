# Redis local dockerizado para el RAG del agente de Tomás.
# Redis Stack trae RediSearch (índice vectorial) + RedisInsight (UI en :8001).
# El profesor puede ignorar esto y apuntar REDIS_URL a su Redis remoto en el .env.
services:
  redis:
    image: redis/redis-stack:latest
    container_name: reiki-redis
    # Puertos del host configurables vía .env (docker compose lo lee solo). Si 6379/8001
    # ya están ocupados (p. ej. en el Windows), usa REDIS_PORT=6380 y REDISINSIGHT_PORT=8002
    # y ajusta REDIS_URL al mismo puerto.
    ports:
      - "${REDIS_PORT:-6379}:6379"          # Redis
      - "${REDISINSIGHT_PORT:-8001}:8001"   # RedisInsight (UI web)
    volumes:
      - reiki_redis:/data
volumes:
  reiki_redis:
