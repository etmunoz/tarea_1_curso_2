  <line x1="680" y1="400" x2="600" y2="455" stroke="#e67e22" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="600" y1="280" x2="680" y2="330" stroke="#e67e22" stroke-width="2" marker-end="url(#a2)"/>
