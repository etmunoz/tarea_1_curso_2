  <text x="265" y="339" text-anchor="middle" font-size="10.5" fill="#999">+ consumidor conversacional</text>

  <!-- Coordinador Mac -->
  <rect x="50" y="392" width="430" height="150" rx="10" fill="#f3f0fb" stroke="#9b8fd6" stroke-width="1.4"/>
  <text x="265" y="414" text-anchor="middle" font-size="14" font-weight="700" fill="#5b4b9e">coordinador (supervisor)</text>
  <text x="265" y="433" text-anchor="middle" font-size="10.8" fill="#5b4b9e">enruta por ficha · locales + remotos (URLS_AGENTES)</text>
  <rect x="70" y="446" width="390" height="82" rx="8" fill="#fff" stroke="#c9b8f0" stroke-dasharray="4 3"/>
  <text x="265" y="466" text-anchor="middle" font-size="12" font-weight="600" fill="#7a5bb0">🛡 guardrails</text>
  <text x="265" y="484" text-anchor="middle" font-size="10.3" fill="#7a5bb0">entrada: vacías/largas/inyección</text>
  <text x="265" y="499" text-anchor="middle" font-size="10.3" fill="#7a5bb0">salida: redacta credenciales</text>
  <text x="265" y="514" text-anchor="middle" font-size="10.3" fill="#7a5bb0">A2A: respuesta remota = dato + resiliencia (agente caído)</text>

  <rect x="50" y="556" width="430" height="64" rx="10" fill="#eef7f0" stroke="#7bbf93"/>
  <text x="265" y="578" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2b7a4b">app web (stdlib) + scripts mac_*.sh</text>
  <text x="265" y="598" text-anchor="middle" font-size="10.5" fill="#2b7a4b">probar agentes uno a uno o vía coordinador · cloudflared tunnel</text>

