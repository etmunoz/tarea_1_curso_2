  <text x="895" y="216" text-anchor="middle" font-size="11" fill="#5b3fa0">Maestro Reiki · RAG</text>
  <rect x="760" y="236" width="270" height="66" rx="8" fill="#fdeaea" stroke="#e06666" stroke-dasharray="4 3"/>
  <text x="895" y="260" text-anchor="middle" font-size="11.5" font-weight="600" fill="#b33">🧠 Redis (RAG, dockerizado)</text>
  <text x="895" y="278" text-anchor="middle" font-size="10" fill="#b33">embeddings Gemini · data/reiki/*</text>
  <text x="895" y="293" text-anchor="middle" font-size="9.5" fill="#999">expuesto SOLO por su RAG, no el Redis</text>

  <!-- Coordinador Windows -->
  <rect x="680" y="392" width="430" height="150" rx="10" fill="#f3f0fb" stroke="#9b8fd6" stroke-width="1.4"/>
  <text x="895" y="414" text-anchor="middle" font-size="14" font-weight="700" fill="#5b4b9e">coordinador (supervisor)</text>
  <text x="895" y="433" text-anchor="middle" font-size="10.8" fill="#5b4b9e">mismo código; aquí Tomás es local y Ezequiel/cocina remotos</text>
  <rect x="700" y="446" width="390" height="82" rx="8" fill="#fff" stroke="#c9b8f0" stroke-dasharray="4 3"/>
  <text x="895" y="472" text-anchor="middle" font-size="12" font-weight="600" fill="#7a5bb0">🛡 mismos guardrails + resiliencia</text>
  <text x="895" y="496" text-anchor="middle" font-size="10.3" fill="#7a5bb0">la misma repo sirve para ambos equipos</text>
  <text x="895" y="514" text-anchor="middle" font-size="10.3" fill="#7a5bb0">(plug and play con scripts win_*.ps1)</text>

  <rect x="680" y="556" width="430" height="64" rx="10" fill="#eef7f0" stroke="#7bbf93"/>
  <text x="895" y="578" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2b7a4b">app web + scripts win_*.ps1</text>
  <text x="895" y="598" text-anchor="middle" font-size="10.5" fill="#2b7a4b">cloudflared tunnel --url http://127.0.0.1:2024</text>

  <!-- Gemini note -->
  <text x="580" y="670" text-anchor="middle" font-size="11.5" fill="#777">Modelo: Gemini (langchain-google-genai) · GOOGLE_API_KEY en .env (nunca versionado) · fichas vía PATCH /assistants/&lt;id&gt;</text>
