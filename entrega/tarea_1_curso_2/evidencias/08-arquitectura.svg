<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 700" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e67e22"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1160" height="700" fill="#ffffff"/>
  <text x="580" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a2e">Arquitectura A2A multi-agente · dos equipos por Cloudflare</text>
  <text x="580" y="56" text-anchor="middle" font-size="12.5" fill="#6b6b80">Taller A2A · Grupo: Fabio Durán - Gustavo Reyes - Ezequiel Muñoz · todo por túneles HTTP (sin LAN, sin TCP)</text>

  <!-- ===== MAC panel ===== -->
  <rect x="30" y="80" width="470" height="560" rx="14" fill="#f5f8ff" stroke="#8fb3e0" stroke-width="1.6"/>
  <text x="265" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="#24506e">💻 Mac · Ezequiel  (MacBook-Pro)</text>

  <!-- langgraph dev Mac -->
  <rect x="50" y="128" width="430" height="250" rx="10" fill="#ffffff" stroke="#b9cbe0" stroke-width="1.3"/>
  <text x="265" y="150" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5b7088">langgraph dev · http://127.0.0.1:2024 (A2A nativo)</text>

  <rect x="70" y="164" width="180" height="92" rx="8" fill="#e9f3ff" stroke="#5b9bd5"/>
  <text x="160" y="186" text-anchor="middle" font-size="13" font-weight="600" fill="#1f5c99">agente_ezequiel</text>
  <text x="160" y="205" text-anchor="middle" font-size="10.5" fill="#1f5c99">IA / Data Science</text>
  <text x="160" y="233" text-anchor="middle" font-size="10.5" fill="#666">🗄 SQLite</text>
  <text x="160" y="247" text-anchor="middle" font-size="10" fill="#888">bd_modelos</text>

  <rect x="280" y="164" width="180" height="92" rx="8" fill="#e8f7ec" stroke="#5cb87a"/>
  <text x="370" y="186" text-anchor="middle" font-size="13" font-weight="600" fill="#1f7a43">agente_cocina</text>
  <text x="370" y="205" text-anchor="middle" font-size="10.5" fill="#1f7a43">recetas chilenas + costeo</text>
  <text x="370" y="233" text-anchor="middle" font-size="10.5" fill="#666">🗄 SQLite</text>
  <text x="370" y="247" text-anchor="middle" font-size="10" fill="#888">recetas/precios</text>

  <rect x="70" y="272" width="390" height="88" rx="8" fill="#fef8e7" stroke="#e8c14c"/>
