<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 660" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="780" height="660" fill="#ffffff"/>
  <text x="390" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a2e">Grafo del coordinador (supervisor + guardrails)</text>
  <text x="390" y="56" text-anchor="middle" font-size="12.5" fill="#6b6b80">Generado desde el grafo LangGraph compilado · Grupo: Fabio Durán - Gustavo Reyes - Ezequiel Muñoz</text>

  <!-- START -->
  <ellipse cx="300" cy="96" rx="52" ry="20" fill="#e8e5ff" stroke="#8b7ff0" stroke-width="1.5"/>
  <text x="300" y="101" text-anchor="middle" font-size="13" fill="#4b3fa0">START</text>

  <!-- guardia_entrada -->
  <rect x="190" y="150" width="220" height="60" rx="10" fill="#fff4e6" stroke="#e8a44c" stroke-width="1.5"/>
  <text x="300" y="175" text-anchor="middle" font-size="14" font-weight="600" fill="#9a5b12">guardia_entrada</text>
  <text x="300" y="194" text-anchor="middle" font-size="11.5" fill="#9a5b12">Guardrail ENTRADA: vacías / largas / inyección</text>

  <!-- rechazo END (bloqueado) -->
  <rect x="470" y="152" width="250" height="56" rx="10" fill="#fdecec" stroke="#e06666" stroke-width="1.5"/>
  <text x="595" y="175" text-anchor="middle" font-size="12.5" font-weight="600" fill="#a33">bloqueado → END</text>
  <text x="595" y="193" text-anchor="middle" font-size="11" fill="#a33">responde el aviso, no llama al LLM</text>

  <!-- enrutar -->
  <rect x="190" y="252" width="220" height="60" rx="10" fill="#e9f3ff" stroke="#5b9bd5" stroke-width="1.5"/>
  <text x="300" y="277" text-anchor="middle" font-size="14" font-weight="600" fill="#1f5c99">enrutar (supervisor)</text>
  <text x="300" y="296" text-anchor="middle" font-size="11.5" fill="#1f5c99">elige 1 agente del catálogo por su ficha</text>

  <!-- consultar -->
  <rect x="60" y="360" width="290" height="86" rx="10" fill="#e8f7ec" stroke="#5cb87a" stroke-width="1.5"/>
  <text x="205" y="384" text-anchor="middle" font-size="14" font-weight="600" fill="#1f7a43">consultar (A2A)</text>
  <text x="205" y="403" text-anchor="middle" font-size="11.5" fill="#1f7a43">reenvía por A2A · guardrails salida + A2A</text>
  <text x="205" y="421" text-anchor="middle" font-size="11.5" fill="#1f7a43">respuesta remota = dato (no instrucción)</text>
  <text x="205" y="438" text-anchor="middle" font-size="11" fill="#c0392b">si cae el remoto → estado controlado (agente_no_disponible)</text>

  <!-- sin_agente -->
  <rect x="450" y="360" width="250" height="60" rx="10" fill="#f0eefb" stroke="#9b8fd6" stroke-width="1.5"/>
  <text x="575" y="385" text-anchor="middle" font-size="14" font-weight="600" fill="#5b4b9e">sin_agente</text>
  <text x="575" y="404" text-anchor="middle" font-size="11.5" fill="#5b4b9e">ningún agente cubre la pregunta</text>

  <!-- END -->
  <ellipse cx="390" cy="560" rx="52" ry="20" fill="#d9d2fb" stroke="#8b7ff0" stroke-width="1.5"/>
  <text x="390" y="565" text-anchor="middle" font-size="13" fill="#4b3fa0">END</text>

  <!-- edges -->
  <line x1="300" y1="116" x2="300" y2="148" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="410" y1="180" x2="468" y2="180" stroke="#e06666" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="440" y="172" text-anchor="middle" font-size="10.5" fill="#a33">bloqueado</text>
  <line x1="300" y1="210" x2="300" y2="250" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="326" y="234" text-anchor="middle" font-size="10.5" fill="#2a7">ok</text>
  <!-- enrutar -> consultar / sin_agente (conditional, dashed) -->
  <path d="M250,312 L205,358" stroke="#555" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#ar)"/>
  <path d="M360,312 L540,358" stroke="#555" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#ar)"/>
  <!-- to END -->
  <path d="M230,446 L360,548" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <path d="M560,420 L420,548" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <path d="M595,208 C595,300 470,430 440,548" stroke="#e06666" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#ar)"/>

  <!-- leyenda -->
  <text x="60" y="618" font-size="11.5" fill="#777">— flecha sólida: arista directa     - - - flecha punteada: arista condicional</text>
  <text x="60" y="636" font-size="11.5" fill="#777">Nodos reales del grafo: __start__ → guardia_entrada → enrutar → {consultar | sin_agente} → __end__</text>
</svg>
