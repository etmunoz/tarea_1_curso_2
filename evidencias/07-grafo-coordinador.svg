<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 720" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="720" fill="#ffffff"/>
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a2e">Grafo del coordinador (guardrails de entrada y salida)</text>
  <text x="410" y="56" text-anchor="middle" font-size="12.5" fill="#6b6b80">Grafo LangGraph compilado · Grupo: Fabio Durán - Gustavo Reyes - Ezequiel Muñoz</text>

  <!-- START -->
  <ellipse cx="300" cy="94" rx="50" ry="19" fill="#e8e5ff" stroke="#8b7ff0" stroke-width="1.5"/>
  <text x="300" y="99" text-anchor="middle" font-size="13" fill="#4b3fa0">START</text>

  <!-- guardia_entrada -->
  <rect x="190" y="142" width="220" height="58" rx="10" fill="#fff4e6" stroke="#e8a44c" stroke-width="1.5"/>
  <text x="300" y="166" text-anchor="middle" font-size="14" font-weight="600" fill="#9a5b12">guardia_entrada</text>
  <text x="300" y="185" text-anchor="middle" font-size="11" fill="#9a5b12">Guardrail ENTRADA: vacías / largas / inyección</text>

  <!-- enrutar -->
  <rect x="190" y="236" width="220" height="58" rx="10" fill="#e9f3ff" stroke="#5b9bd5" stroke-width="1.5"/>
  <text x="300" y="260" text-anchor="middle" font-size="14" font-weight="600" fill="#1f5c99">enrutar (supervisor)</text>
  <text x="300" y="279" text-anchor="middle" font-size="11" fill="#1f5c99">elige 1 agente del catálogo (allow-list)</text>

  <!-- consultar -->
  <rect x="55" y="336" width="290" height="86" rx="10" fill="#e8f7ec" stroke="#5cb87a" stroke-width="1.5"/>
  <text x="200" y="360" text-anchor="middle" font-size="14" font-weight="600" fill="#1f7a43">consultar (A2A)</text>
  <text x="200" y="379" text-anchor="middle" font-size="11" fill="#1f7a43">reenvía por A2A · guardrail A2A (respuesta = dato)</text>
  <text x="200" y="396" text-anchor="middle" font-size="11" fill="#1f7a43">resiliencia: remoto caído → estado controlado</text>
  <text x="200" y="413" text-anchor="middle" font-size="10.5" fill="#c0392b">(ruta agente_no_disponible)</text>

  <!-- sin_agente -->
  <rect x="470" y="336" width="250" height="58" rx="10" fill="#f0eefb" stroke="#9b8fd6" stroke-width="1.5"/>
  <text x="595" y="360" text-anchor="middle" font-size="14" font-weight="600" fill="#5b4b9e">sin_agente</text>
  <text x="595" y="379" text-anchor="middle" font-size="11" fill="#5b4b9e">ningún agente cubre la pregunta</text>

  <!-- guardia_salida -->
  <rect x="210" y="474" width="400" height="74" rx="10" fill="#fdeef6" stroke="#d96aa6" stroke-width="1.7"/>
  <text x="410" y="499" text-anchor="middle" font-size="14" font-weight="700" fill="#a83270">guardia_salida  (común a TODO camino)</text>
  <text x="410" y="518" text-anchor="middle" font-size="11" fill="#a83270">Guardrail SALIDA: redacta credenciales · tope de longitud · no vacío</text>
  <text x="410" y="535" text-anchor="middle" font-size="10.5" fill="#a83270">pasan también sin_agente y el aviso de guardia_entrada</text>

  <!-- END -->
  <ellipse cx="410" cy="610" rx="50" ry="19" fill="#d9d2fb" stroke="#8b7ff0" stroke-width="1.5"/>
  <text x="410" y="615" text-anchor="middle" font-size="13" fill="#4b3fa0">END</text>

  <!-- edges -->
  <line x1="300" y1="113" x2="300" y2="140" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="300" y1="200" x2="300" y2="234" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="322" y="222" text-anchor="middle" font-size="10.5" fill="#2a7">ok</text>
  <!-- guardia_entrada bloqueado -> guardia_salida (left curve) -->
  <path d="M190,180 C90,210 90,460 206,500" stroke="#e06666" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#ar)"/>
  <text x="96" y="340" text-anchor="middle" font-size="10.5" fill="#a33">bloqueado</text>
  <!-- enrutar -> consultar / sin_agente -->
  <path d="M250,294 L205,334" stroke="#555" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#ar)"/>
  <path d="M360,294 L560,334" stroke="#555" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#ar)"/>
  <!-- consultar/sin_agente -> guardia_salida -->
  <path d="M230,422 L340,472" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <path d="M580,394 L470,472" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <!-- guardia_salida -> END -->
  <line x1="410" y1="548" x2="410" y2="590" stroke="#555" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- leyenda -->
  <text x="55" y="672" font-size="11.5" fill="#777">— sólida: arista directa     - - - punteada: arista condicional</text>
  <text x="55" y="690" font-size="11.5" fill="#777">__start__ → guardia_entrada → enrutar → {consultar | sin_agente} → guardia_salida → __end__</text>
</svg>
