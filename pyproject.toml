# Creación: 20261110 1514
# Última modificación: 20261111 1413
# --8<-- fin-encabezado-grupo

[project]
name = "tarea-1-curso-2"
version = "0.1.0"
description = "Taller A2A (Curso 2 · Sesión 1): agente de viajes LangGraph expuesto por A2A nativo, swarm y agente conversacional."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Grupo: Fabio Durán · Gustavo Reyes · Ezequiel Muñoz" }]
dependencies = [
  # runtime del agente (familia LangChain 1.x)
  "langchain>=1.3,<2",
  "langchain-core>=1.6,<2",
  "langgraph>=1.2,<2",
  "langchain-google-genai>=4.3,<5",
  "langgraph-swarm>=0.1.0",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  # servidor local de LangGraph (expone A2A en /a2a/{assistant_id})
  "langgraph-cli[inmem]>=0.4",
  "langgraph-api>=0.15.1",
  # consumir agentes (langgraph_sdk + protocolo A2A)
  "langgraph-sdk>=0.4",
  "a2a-sdk>=1.2",
  # pruebas y notebooks
  "pytest>=8",
  "nbformat>=5.10",
  "ipykernel>=6",
  # RAG del agente de Tomás (Redis como vector store + carga de documentos)
  "langchain-redis>=0.2",
  "redis>=5",
  "pypdf>=5",
  "langchain-text-splitters>=0.3",
]

# No es un paquete instalable: el código se ejecuta desde la raíz con imports `src.*`
# (así lo hace `langgraph dev`). uv solo gestiona el entorno y las dependencias.
[tool.uv]
package = false
